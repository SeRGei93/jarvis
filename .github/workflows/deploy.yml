# Сборка образа на GitHub-hosted runner → GHCR. Dokploy на сервере тянет его
# сам (pull_policy: always) — сервер ничего не компилирует.
#
# Деплой запускается отдельной job'ой ПОСЛЕ того, как образ запушен. Если
# оставить авто-деплой Dokploy на push, он стартует раньше сборки и подтягивает
# предыдущий :latest — бот остаётся старым. Для автоматического деплоя
# добавьте в GitHub secrets DOKPLOY_DEPLOY_WEBHOOK (Dokploy → Compose →
# Webhook), а авто-деплой по push в Dokploy выключите.
#
# Проверок (типы, тесты) здесь нет: репозиторий приватный, минуты Actions
# платные — их прогоняет локально `npm run typecheck && npm test` (backend/).
# Типы всё равно ловятся сборкой образа: Dockerfile компилирует бэкенд через
# tsc, миниап — через vite build.
#
# Перед деплоем: в Dokploy добавьте GHCR registry (Settings → Registry,
# PAT с read:packages), Create → Compose → GitHub (репозиторий) →
# Compose Path: docker-compose.dokploy.yml → Environment → Deploy →
# Domains (один хост, весь трафик → app порт 8080).
name: Build & push image

on:
  push:
    # Релизные теги не деплоят: Dokploy настроен на ветку, а payload ниже
    # строит ref как refs/heads/<branch> — тег не должен маскироваться под неё.
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - "deploy/docker-entrypoint.sh"
      - "docker-compose.dokploy.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/sergei93/jarvis-app:${{ github.sha }}
            ghcr.io/sergei93/jarvis-app:latest

  # Запускается только после успешной сборки и пуша образа: к этому моменту
  # :latest уже новый, и Dokploy не может подтянуть предыдущий.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
          IMAGE_SHA: ${{ github.sha }}
          DEPLOY_REF: ${{ github.ref_name }}
          DEPLOY_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            echo "::warning::DOKPLOY_DEPLOY_WEBHOOK не задан — деплой в Dokploy пропущен. Добавьте webhook в secrets."
            exit 0
          fi

          # Dokploy проверяет branch по GitHub-payload (заголовок
          # X-GitHub-Event + body.ref). Без тела webhook отвечает
          # {"message":"Branch Not Match"} и деплой молча не запускается.
          # К коммитам из события добавляем синтетический с путями приложения,
          # чтобы watchPaths тоже увидели изменения (например, при пуше только
          # workflow-файла).
          commits=$(jq -c '[.commits[]? | {added: (.added // []), modified: (.modified // []), removed: (.removed // [])}] + [{"added":[],"modified":["backend/src/app.ts","frontend/src/main.tsx","Dockerfile","docker-compose.dokploy.yml"],"removed":[]}]' "$GITHUB_EVENT_PATH")

          payload=$(mktemp)
          jq -n \
            --arg ref "refs/heads/${DEPLOY_REF}" \
            --arg sha "${IMAGE_SHA}" \
            --arg message "${DEPLOY_MESSAGE:-$IMAGE_SHA}" \
            --argjson commits "$commits" \
            '{ref: $ref, head_commit: {id: $sha, message: $message}, commits: $commits}' > "$payload"

          status=$(curl --silent --show-error --max-time 60 \
            --retry 3 --retry-delay 5 \
            -o /tmp/dokploy-response.json -w '%{http_code}' \
            -X POST "$DOKPLOY_DEPLOY_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            --data-binary "@$payload")
          cat /tmp/dokploy-response.json || true
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Dokploy webhook failed with HTTP $status"
            exit 1
          fi
          echo "Dokploy deploy triggered for ${IMAGE_SHA}"
